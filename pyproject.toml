[project]
name = "bulk-insert"
version = "0.1.0"
description = "Asynchronous resilient data extraction pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.30.0",
    "instructor>=1.3.0",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    # torch is a sentence-transformers dependency; declared explicitly so the
    # CPU-only wheel index below applies on Linux (drops the ~3.5 GB of CUDA /
    # triton GPU libraries the default PyPI wheel would pull). CPU-only is all a
    # container doing sentence-transformer inference needs.
    "torch>=2.2.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    # Phase 9 — structured JSON logging to stdout/stderr.
    "python-json-logger>=3.1",
]

[project.scripts]
bulk-insert-cli = "bulk_insert.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_insert"]

# Install torch from the PyTorch CPU wheel index on Linux (the container target),
# which omits the CUDA/nvidia + triton GPU dependencies. On macOS/Windows the
# default PyPI wheel is already CPU-only, so the source is scoped to Linux to keep
# local dev resolving normally.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.ruff.lint.isort]
# Pin first-party classification so import grouping is identical across ruff
# versions (the project ruff and the pinned pre-commit ruff differ in their
# auto-detection now that the package is installable).
known-first-party = ["bulk_insert"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live tests that require external API keys and network access",
]

[project]
name = "bulk-insert"
version = "0.1.0"
description = "Asynchronous resilient data extraction pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.30.0",
    "instructor>=1.3.0",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
bulk-insert-cli = "bulk_insert.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_insert"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.ruff.lint.isort]
# Pin first-party classification so import grouping is identical across ruff
# versions (the project ruff and the pinned pre-commit ruff differ in their
# auto-detection now that the package is installable).
known-first-party = ["bulk_insert"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live tests that require external API keys and network access",
]
